name: Build Ractex Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Ractex-PC/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Ractex-PC
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'application
        run: gradle clean installDist
      - name: Créer Ractex.exe avec runtime Java intégré
        shell: pwsh
        run: |
          $app = Resolve-Path 'build/install/RactexPC'
          New-Item -ItemType Directory -Force -Path 'build/package' | Out-Null
          jpackage --type app-image --name Ractex --input "$($app.Path)/lib" --main-jar 'RactexPC-0.1.0.jar' --main-class 'fr.ractex.pc.RactexPC' --dest 'build/package' --app-version '0.1.0' --vendor 'Ractex'
          if (!(Test-Path 'build/package/Ractex/Ractex.exe')) { throw 'Ractex.exe non généré' }
          Compress-Archive -Path 'build/package/Ractex' -DestinationPath 'build/Ractex-Windows.zip' -Force
      - name: Publier le programme Windows
        uses: actions/upload-artifact@v4
        with:
          name: Ractex-Windows
          path: Ractex-PC/build/Ractex-Windows.zip
          if-no-files-found: error
          retention-days: 14
