name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser
        run: unzip -q ./*.zip
      - name: Fix backslash n
        run: |
          perl -0pi -e 's/\\n(?=\s*(private|public|addTap))/\n/g' Ractex-Bedrock-Java-Android/app/src/main/java/fr/ractex/bedrockjava/*.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compiler
        working-directory: Ractex-Bedrock-Java-Android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ractex-apk
          path: Ractex-Bedrock-Java-Android/app/build/outputs/apk/debug/app-debug.apk
